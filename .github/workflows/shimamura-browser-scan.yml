name: Shimamura browser scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/shimamura-browser-scan.yml"
      - "scripts/scan-shimamura-browser.cjs"
  schedule:
    - cron: "17 2,10,18 * * *"

permissions:
  contents: write

concurrency:
  group: shimamura-browser-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn
      - name: Scan public product pages
        run: node scripts/scan-shimamura-browser.cjs
      - name: Save changed snapshot
        run: |
          if git diff --quiet -- data/shimamura-products.json; then
            echo "No snapshot change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shimamura-products.json
          git commit -m "Update Shimamura product snapshot"
          git push
